name: tonas
summary: The TONAS dataset includes 72 monophonic, a cappella sung excerpts (16 Deblas,
  36 Martinete 1, 20 Martinete 2) for melody extraction and music transcription, with
  annotations specifying notes, F0, and energy values at timestamps.
annotations:
- F0Data
- NoteData
tasks:
- Melody Extraction
- Music Transcription
