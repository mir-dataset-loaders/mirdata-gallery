name: acousticbrainz_genre
summary: The dataset includes audio from four sources with genre and subgenre annotations
  from AllMusic, Discogs, Lastfm, and Tagtraum, suited for hierarchical multi-label
  genre classification. Annotations cover both explicit and inferred genre/subgenre
  labels, focusing on content-based music genre recognition.
