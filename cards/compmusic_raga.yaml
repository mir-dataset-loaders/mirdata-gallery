name: compmusic_raga
summary: The compmusic_raga dataset includes full-length audio recordings of Carnatic
  and Hindustani music, with associated rāga labels for 154 hours of audio, enabling
  automatic rāga recognition. Annotations provide rāga identifiers, tonal information,
  and pitch segments.
