summary: The BRID dataset includes 367 solo and multiple-instrument recordings of
  10 Brazilian instruments across 5 rhythm classes, providing annotations for beat
  tracking and rhythmic pattern recognition. Primary tasks involve analyzing and understanding
  Brazilian musical rhythms.
