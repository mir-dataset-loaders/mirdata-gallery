name: brid
summary: The BRID dataset includes 367 solo and multiple-instrument recordings of
  Brazilian music, covering 10 instrument classes and 5 rhythm classes. It provides
  annotations for beat tracking and tempo estimation, suitable for MIR research in
  computational rhythm analysis.
