name: vocadito
summary: vocadito includes 40 short solo singing excerpts in 7 languages. Annotations
  provide frame-level f0, note annotations, lyrics, and language. Tasks focus on lyrics
  transcription, alignment, melody extraction, and music transcription.
annotations:
- F0Data
- LyricData
- NoteData
tasks:
- Lyrics Transcription
- Lyrics-to-Audio Alignment
- Melody Extraction
- Music Transcription
