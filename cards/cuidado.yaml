name: cuidado
summary: The Cuidado Rhythm Dataset includes beat and bar annotations for various
  ballroom dance styles, designed for tasks such as beat tracking and tempo estimation.
  Annotations are provided for beats and bars in cuidado dance music, facilitating
  rhythm analysis and tempo estimation.
