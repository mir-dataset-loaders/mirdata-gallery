summary: The Cuidado Rhythm Dataset includes beat and bar annotations for various
  ballroom dance styles like Waltz, Tango, and Samba, designed for tasks such as beat
  tracking and rhythm analysis in cuidado dance music. Annotations are provided in
  `.beats` files, reflecting the characteristic rhythms of each dance style.
