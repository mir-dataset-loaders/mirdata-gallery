name: giantsteps_key
summary: The giantsteps_key dataset includes 600 two-minute EDM sound excerpts annotated
  with single-key labels, and 500 tracks with pitch-class set descriptions. It is
  primarily intended for key estimation and tempo estimation tasks in electronic dance
  music.
