download_info: "\n    The audio files can be downloaded following the path described\
  \ in https://github.com/MTG/mtg-jamendo-dataset#downloading-the-data\n    \n   \
  \ To download audio, unpack and validate all tar archives:\n    \n    .. code-block::\
  \ console\n\n          mkdir /path/to/download\n          python3 scripts/download/download.py\
  \ --dataset autotagging_moodtheme --type audio /path/to/download --unpack --remove\n\
  \    \n    Later add the files to a folder into mir_datasets called audio/ with\
  \ the following structure:\n        > mtg_jamendo_autotagging_moodtheme/\n     \
  \       > audios/\n                > 00/\n                ...\n                >\
  \ 99/\n"
