name: saraga_hindustani
summary: The dataset includes 108 Hindustani music tracks with time-aligned annotations
  for sections, tempos, rhythmic cycles, phrases, and audio features like pitch and
  tonic. It supports tasks such as beat tracking, melody extraction, and music structure
  analysis.
annotations:
- BeatData
- EventData
- F0Data
- SectionData
tasks:
- Beat Tracking
- Melody Extraction
- Music Structure Analysis
