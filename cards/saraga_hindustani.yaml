name: saraga_hindustani
summary: The dataset includes 108 Hindustani music tracks with annotations for melody,
  rhythm, structure, and tempo. It provides manual section and tempo annotations,
  rhythmic cycle boundaries, phrase transcriptions, and automatically extracted pitch
  and tonic. The primary MIR tasks are Lyrics Transcription, Lyrics-to-Audio Alignment,
  Melody Extraction, Music Structure Analysis, and Tempo Estimation.
annotations:
- F0Data
- LyricData
- SectionData
- TempoData
tasks:
- Lyrics Transcription
- Lyrics-to-Audio Alignment
- Melody Extraction
- Music Structure Analysis
- Tempo Estimation
