name: guitarset
summary: GuitarSet includes 360 close-to-30-second acoustic guitar recordings across
  various styles, tempi, and versions, with annotations for pitch, beats, tempo, and
  chords. The primary MIR tasks involve analyzing these recordings to extract musical
  features and annotations.
