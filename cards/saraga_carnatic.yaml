summary: The saraga_carnatic dataset includes 249 Carnatic music tracks with time-aligned
  melody, rhythm, and structural annotations, along with automatically extracted pitch
  and tonic features. Annotations cover sections, tempos, rhythmic cycles, and phrase
  transcriptions using solfège symbols.
