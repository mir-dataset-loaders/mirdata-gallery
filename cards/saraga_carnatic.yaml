name: saraga_carnatic
summary: The dataset includes 249 Carnatic Music tracks with annotations for melody,
  rhythm, structure, and tempo, along with automatically extracted pitch and tonic.
  Tasks involve lyrics transcription, alignment, melody extraction, structure analysis,
  and tempo estimation.
annotations:
- F0Data
- LyricData
- SectionData
- TempoData
tasks:
- Lyrics Transcription
- Lyrics-to-Audio Alignment
- Melody Extraction
- Music Structure Analysis
- Tempo Estimation
