summary: EGFxSet includes 8,970 5-second audio recordings of electric guitar tones
  processed through 12 real guitar effects, covering 138 notes across 5 pickup configurations.
  Annotations provide detailed effect settings and guitar parameters. The primary
  MIR task involves analyzing and classifying these audio samples based on their tonal
  and effect characteristics.
