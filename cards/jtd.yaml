name: jtd
summary: The Jazz Trio Database (JTD) includes 1,294 multitrack jazz performances,
  with audio content comprising raw stereo and unmixed piano, bass, and drums. Annotations
  provide beat and downbeat timestamps, MIDI transcriptions, and onset timestamps
  for the unmixed audio, supporting tasks like beat tracking and music transcription.
annotations:
- BeatData
- EventData
- NoteData
tasks:
- Beat Tracking
- Music Transcription
- Source Separation
