download_info: "\nTo download the audio for files for JTD, visit: https://zenodo.org/records/13828030\
  \ and request access.\n\nAfter you've been granted access, press the \"Download\
  \ all\" button on the Zenodo record.\n\nThis will create a new file named files-archive\
  \ (with no extension). Rename the file to files-archive.zip and extract \nusing\
  \ any unzipping tool (7zip, WinRAR, the unarchiver) or the command line. This will\
  \ give you a list of multi-part \nzip files in the form [processed.zip.001, processed.zip.002,\
  \ ...] and [raw.zip.001, raw.zip.002, ...]. \n\nTo extract these, use 7zip from\
  \ the command line:\n\n```\n7z x processed.zip.001\n7z x raw.zip.001\n```\n\nNote\
  \ that the default `unzip` command on Linux can't handle these files, so you'll\
  \ need to use 7zip. You may also be \nable to use a GUI tool like WinRAR, which\
  \ was used to create the archive in the first place. \n\nThese commands will extract\
  \ the audio to the current folder. You'll then need to move the results to {0}/processed\
  \ and \n{0}/raw, respectively, creating these folders if they don't already exist.\n\
  \nCombined with the annotation files (which can be obtained by calling `.download()`\
  \ on the `mirdata.Dataset` instance \nyou've just initialized), the end result should\
  \ be a file structure that looks like:\n\n```\n{0}\n├─ raw\n│  ├─ barronk-allgodschildren-drummondrrileyb-1990-8b77c067.wav\
  \    # one to three audio files per performance\n│  ├─ ...\n├─ processed\n│  ├─\
  \ barronk-allgodschildren-drummondrrileyb-1990-8b77c067_piano.wav     # always three\
  \ audio files per performance\n│  ├─ barronk-allgodschildren-drummondrrileyb-1990-8b77c067_bass.wav\n\
  │  ├─ barronk-allgodschildren-drummondrrileyb-1990-8b77c067_drums.wav\n│  ├─ ...\n\
  ├─ annotations\n│  ├─ barronk-allgodschildren-drummondrrileyb-1990-8b77c067    #\
  \ one folder per performance\n│  │  ├─ bass_onsets.csv\n│  │  ├─ beats.csv\n│  │\
  \  ├─ ...\n│  ├─ barronk-beautifullove-mrazgrileyb-2009-c87abfa6\n│  ├─ ...\n```\n\
  \n"
