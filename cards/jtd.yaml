summary: The Jazz Trio Database (JTD) includes 1,294 multitrack jazz performances,
  with annotations for beat and downbeat timestamps, MIDI transcriptions, and onset
  timestamps for unmixed audio tracks, primarily for jazz piano trio performances.
  The dataset supports tasks like onset detection, beat tracking, and automatic transcription.
