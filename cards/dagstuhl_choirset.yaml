summary: Dagstuhl ChoirSet includes multitrack a cappella choral recordings with close-up
  (larynx, dynamic, headset) and room microphone tracks, along with piano accompaniment.
  Annotations provide individual singer tracks for MIR tasks such as source separation
  and pitch estimation.
