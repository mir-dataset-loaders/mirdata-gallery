summary: This dataset includes two-minute stereo mp3 audio excerpts from Hindustani
  music, annotated with time-aligned markers indicating taal cycles, sam, and matras,
  along with metadata on tempo, artist, and raag. The primary MIR task is taal and
  beat tracking.
