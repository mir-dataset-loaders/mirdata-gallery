summary: The Medley-solos-DB dataset includes 3-second audio clips of solo instruments
  from MedleyDB and solosDB, covering eight instruments (clarinet, distorted electric
  guitar, female singer, flute, piano, tenor saxophone, trumpet, violin), for automatic
  musical instrument recognition.
