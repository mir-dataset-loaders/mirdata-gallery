name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:  

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} - ${{ matrix.os }} 
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # docs/requirements.txt: tests/test_gallery.py imports the Sphinx extension
        run: pip install -r requirements.txt -r docs/requirements.txt

      - name: Run tests
        run: pytest tests
