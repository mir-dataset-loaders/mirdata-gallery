name: Update cards

# Finds mirdata datasets that have no card yet, generates their cards
# (fields + LLM summary) and opens a pull request. Runs weekly and on demand.
#
# Needs one repository setting: Settings > Actions > General >
# "Allow GitHub Actions to create and approve pull requests".

on:
  push:
    branches: [test_llm]  # temporary: run on every push to this branch for testing
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements.txt installs mirdata from its master branch on GitHub,
      # so every run sees the newest loaders. No pip cache on purpose.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install huggingface_hub

      # The 4-bit Qwen model (about 4.7 GB) is downloaded on the first run and
      # kept in the Actions cache; later runs restore it instead.
      - name: Cache the LLM
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen2.5-7b-instruct-q4_k_m

      - name: Generate cards for datasets that have none
        run: python scripts/generate_cards.py --missing

      # Does nothing when no card was added or changed.
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PR_TEST }}
          add-paths: cards/*.yaml
          branch: auto/new-cards
          title: "Add cards for new mirdata datasets"
          commit-message: "Add cards for new mirdata datasets"
          body: |
            mirdata master has datasets without a card. Generated with
            `scripts/generate_cards.py --missing`; summaries by `scripts/llm.py`.
